[project]
name = "lumiere"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=4.1",
    "django>=5.1,<6.0",
    "django-cors-headers>=4.2.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.5",
    "django-filter>=24.3",
    "drf-spectacular>=0.28",
    "pillow>=10.0",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
    "sqlparse==0.4.4",
    "stripe>=11.0",
    "channels>=4.2.2",
    "daphne>=4.2.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "coverage>=7.0",
]
